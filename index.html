<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Worksetu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS (matched to worksetu-web) ============ */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --primary:#2563eb; --primary-600:#1d4ed8; --primary-soft:#eff6ff; --primary-line:#bfdbfe;
  --success:#16a34a; --success-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7;
  --danger:#dc2626; --danger-soft:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --radius:18px;
}
html[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#1a2540; --border:#243049;
  --text:#e5e9f2; --muted:#94a3b8; --faint:#64748b;
  --primary:#3b82f6; --primary-600:#2563eb; --primary-soft:rgba(59,130,246,.14); --primary-line:rgba(59,130,246,.35);
  --success:#22c55e; --success-soft:rgba(34,197,94,.14); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.ic{display:block;flex-shrink:0}

/* ============ APP SHELL ============ */
#app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden}
@media (min-width:501px){
  body{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#dbeafe,#e2e8f0 60%)}
  html[data-theme="dark"] body{background:radial-gradient(circle at 30% 20%,#1e293b,#020617 60%)}
  #app{position:fixed;left:50%;top:50%;width:390px;height:844px;border-radius:48px;border:11px solid #0f172a;box-shadow:0 30px 80px rgba(15,23,42,.35);transform:translate(-50%,-50%) scale(var(--phone-scale,1));transform-origin:center}
}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:15px;font-weight:600;background:var(--surface);position:relative;z-index:5}
.statusbar.on-blue{background:transparent;color:#fff;position:absolute;left:0;right:0;top:0}
.sb-icons{display:flex;gap:6px;align-items:center}
.batt{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;position:relative;opacity:.9}
.batt:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:1px}
.batt i{display:block;height:100%;width:80%;background:currentColor;border-radius:1.5px}
body.no-sb .statusbar{display:none}

.topbar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px 12px;display:flex;align-items:center;gap:10px;min-height:60px;position:relative;z-index:4}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;text-transform:uppercase}
.topbar .sub{font-size:11px;color:var(--muted);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;color:var(--muted);position:relative;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface-2)}
.logo-img{display:inline-flex;align-items:center;flex-shrink:0;background:#fff;border-radius:9px;padding:3px 7px}
.logo-img img{height:100%;width:auto;display:block}
.splash .logo-img{border-radius:16px;padding:12px 18px;box-shadow:0 12px 30px rgba(0,0,0,.22);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#1e40af);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;letter-spacing:-.04em;box-shadow:0 4px 12px rgba(37,99,235,.3);flex-shrink:0}
.brand-name{font-weight:900;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.chip{font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);letter-spacing:.03em;white-space:nowrap}
.brand-sub{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.content::-webkit-scrollbar{display:none}
.page{padding:16px 16px 28px}
.anim-fwd .page{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.anim-back .page{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.anim-fade .page{animation:fadeUp .35s ease}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* ============ BOTTOM NAV ============ */
.bottomnav{flex-shrink:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:4}
@media (min-width:501px){.bottomnav{padding-bottom:22px}}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--faint);padding:4px 0;position:relative}
.nav-item .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s,color .2s}
.nav-item.active{color:var(--primary)}
.nav-item.active .pill{background:var(--primary-soft)}
.nav-badge{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.cta-bar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
@media (min-width:501px){.cta-bar{padding-bottom:24px}}

/* ============ COMMON UI ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.3)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sm{height:38px;font-size:12px;border-radius:11px;letter-spacing:.04em}
.btn-success{background:var(--success);color:#fff}
.btn-danger-soft{background:var(--danger-soft);color:var(--danger)}
.eyebrow{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.08em;text-transform:uppercase}
.h-display{font-size:30px;line-height:1.05;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.muted{color:var(--muted)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
.sec-head h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sec-head button{font-size:12.5px;font-weight:700;color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.b-blue{background:var(--primary-soft);color:var(--primary)}
.b-green{background:var(--success-soft);color:var(--success)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-gray{background:var(--surface-2);color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t-title{font-weight:700;font-size:14.5px}
.t-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{padding:14px;display:flex;align-items:center;gap:12px}
.divider{height:1px;background:var(--border);margin:14px 0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.lang-seg{flex:1;padding:3px;gap:3px}
.lang-seg button{height:32px;font-size:12px;padding:0 4px}
.settings .s-item.s-lang{flex-wrap:wrap}
.s-lang .lang-seg{flex-basis:100%}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.3,1.3)}
.toggle.on{background:var(--success)}
.toggle.on:after{transform:translateX(20px)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-bottom:7px;text-transform:uppercase}
.input{display:flex;align-items:center;gap:10px;height:52px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);padding:0 14px;color:var(--faint);transition:border-color .2s,box-shadow .2s}
.input:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--text);min-width:0}
.input input::placeholder{color:var(--faint)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.err{color:var(--danger);font-size:12.5px;font-weight:600;margin:-4px 2px 12px;display:none}
.err.show{display:block}

/* Splash */
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#2563eb,#1e3a8a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:50;transition:opacity .45s}
.splash .logo{width:84px;height:84px;border-radius:26px;font-size:30px;background:#fff;color:var(--primary);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.splash h2{margin-top:18px;font-size:28px;font-weight:900;letter-spacing:.04em;animation:fadeUp .6s .15s both}
.splash p{font-size:11px;font-weight:700;letter-spacing:.2em;opacity:.8;margin-top:4px;animation:fadeUp .6s .25s both}
.loader{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:34px;overflow:hidden}
.loader i{display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:load 1.1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.splash .foot{position:absolute;bottom:42px;font-size:11px;opacity:.7;font-weight:600;letter-spacing:.06em}

/* Login */
.login-hero{background:linear-gradient(160deg,#2563eb 0%,#1e40af 100%);color:#fff;padding:60px 20px 64px;position:relative;overflow:hidden}
.login-hero:before,.login-hero:after,.hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.login-hero:before{width:220px;height:220px;right:-70px;top:-50px}
.login-hero:after{width:140px;height:140px;left:-40px;bottom:-60px}
.pill-light{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:999px;text-transform:uppercase}
.pill-light i{width:6px;height:6px;border-radius:50%;background:#86efac;display:block}
.login-card{margin:-40px 16px 0;padding:18px;position:relative;z-index:2}
.hero-langs{display:flex;justify-content:flex-end;gap:4px;margin:-12px 0 16px;position:relative;z-index:1}
.hero-langs button{height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);transition:all .2s}
.hero-langs button.on{background:#fff;color:var(--primary)}
.master-card{margin-top:14px;border:1.5px dashed var(--primary-line);background:var(--primary-soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.master-card .mk{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center}

/* Home */
.loc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.loc small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.search{display:flex;align-items:center;gap:10px;width:100%;height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--border);padding:0 14px;color:var(--faint);font-size:14px;margin-top:14px;text-align:left}
.hero-card{margin-top:16px;border-radius:22px;padding:20px;background:linear-gradient(140deg,#2563eb,#1e3a8a);color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(37,99,235,.3)}
.hero-card:before{width:180px;height:180px;right:-50px;top:-60px}
.hero-card:after{width:110px;height:110px;right:40px;bottom:-60px}
.hero-card h2{font-size:24px;font-weight:900;line-height:1.05;margin:12px 0 8px;letter-spacing:-.01em}
.hero-card p{font-size:13px;opacity:.85;max-width:240px;line-height:1.45}
.btn-white{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1d4ed8;font-weight:800;font-size:12px;letter-spacing:.05em;padding:11px 16px;border-radius:12px;text-transform:uppercase;position:relative;z-index:1}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc-tile{padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;text-align:center;transition:transform .15s}
.svc-tile:active{transform:scale(.95)}
.svc-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.worker-card{min-width:210px;padding:14px}
.stars{display:inline-flex;align-items:center;gap:3px;color:#f59e0b;font-weight:800;font-size:12px}
.feature{padding:14px;display:flex;gap:12px;align-items:flex-start}
.feature .fi{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 12px}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--primary);letter-spacing:-.02em}
.stat span{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.active-bk{padding:14px;margin-top:16px;border-left:4px solid var(--primary)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .5s}

/* Booking */
.svc-hero{padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex-shrink:0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;text-align:center;transition:all .15s}
.chip-btn small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.chip-btn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.chip-btn.on small{color:var(--primary)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots .chip-btn{padding:11px 4px}
.chip-btn.disabled{opacity:.4;text-decoration:line-through;pointer-events:none}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
.sum-row.total{font-weight:800;font-size:16px;border-top:1px dashed var(--border);margin-top:6px;padding-top:12px}
.success-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.check-circle{width:96px;height:96px;border-radius:50%;background:var(--success);display:grid;place-items:center;color:#fff;animation:pop .5s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 0 12px var(--success-soft)}
.check-circle svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Tracking */
.map{height:190px;border-radius:20px;position:relative;overflow:hidden;background:
  linear-gradient(90deg,transparent 48%,rgba(148,163,184,.35) 48%,rgba(148,163,184,.35) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(0deg,transparent 48%,rgba(148,163,184,.35) 48%,rgba(148,163,184,.35) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(135deg,#e0f2fe,#ecfdf5)}
html[data-theme="dark"] .map{background:
  linear-gradient(90deg,transparent 48%,rgba(100,116,139,.3) 48%,rgba(100,116,139,.3) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(0deg,transparent 48%,rgba(100,116,139,.3) 48%,rgba(100,116,139,.3) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(135deg,#0c1a33,#0b2420)}
.map svg.route{position:absolute;inset:0}
.pin-home,.pin-worker{position:absolute;display:grid;place-items:center;border-radius:50%}
.pin-home{width:34px;height:34px;background:var(--primary);color:#fff;right:48px;top:40px;box-shadow:0 0 0 8px rgba(37,99,235,.2)}
.pin-worker{width:30px;height:30px;background:#fff;color:var(--success);border:3px solid var(--success);transition:left 1s ease,top 1s ease;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.pin-worker:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--success);animation:ping 1.6s infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.4);opacity:0}}
.eta{position:absolute;left:12px;bottom:12px;background:var(--surface);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.timeline{position:relative;padding-left:4px}
.tl{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl:last-child{padding-bottom:0}
.tl:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border)}
.tl:last-child:before{display:none}
.tl.done:before{background:var(--success)}
.tl .dotc{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;flex-shrink:0;color:#fff;position:relative;z-index:1}
.tl.done .dotc{background:var(--success);border-color:var(--success)}
.tl.now .dotc{border-color:var(--primary);box-shadow:0 0 0 5px var(--primary-soft)}
.tl.now .dotc:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.tl .t-title{font-size:13.5px}
.tl:not(.done):not(.now) .t-title{color:var(--faint)}
.otp{display:flex;gap:6px}
.otp span{width:34px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:900;font-size:17px}

/* Worker */
.online-card{padding:16px;display:flex;align-items:center;gap:14px;transition:background .3s}

<script>
/* =====================================================================
   WORKSETU - LOCAL MOBILE SIMULATION
   100% offline sandbox. No API calls, no database, no production access.
   Everything below is hard-coded demo data held in memory.
   ===================================================================== */

// The standalone build shipped a kill-switch here that replaced fetch,
// XMLHttpRequest, WebSocket and sendBeacon with rejecting stubs, so nothing
// could reach a backend. This build signs in against the live API, so the
// kill-switch is gone. Screens that have not been wired yet still read from
// the in-memory demo data below.

// ---- Backend ----
// Same-origin by default: the preview server proxies /api/v1 to the Render
// API. Set window.WORKSETU_API_BASE to the API origin when this is served
// from somewhere that is not proxying (that host must then be in the API's
// CORS_ALLOWED_ORIGINS).
const API_BASE = (window.WORKSETU_API_BASE || '') + '/api/v1';

// Cooperative commission, matching PlatformConfig.commissionPercent on the API.
const COMMISSION_PCT = 15;

// Seeded cooperative accounts on the live API. These are demo members, not
// the credentials of any real person.
const DEMO_ACCOUNTS = {
  customer: { identifier:'deepika.demo@worksetu.test', password:'Customer@123' },
  worker:   { identifier:'ravi.demo@worksetu.test',    password:'Worker@123' },
  admin:    { identifier:'registrar.demo@worksetu.test', password:'AdminPass@123' }
};

async function apiLogin(role, identifier, password){
  const res = await fetch(`${API_BASE}/auth/${role}/login`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    credentials:'include', // refresh token comes back as an httpOnly cookie
    body: JSON.stringify({ identifier, password })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data?.error?.message || `Sign-in failed (${res.status})`);
  return data; // { userId, token, role }
}

async function apiMe(token){
  const res = await fetch(`${API_BASE}/users/me`, { headers:{ Authorization:`Bearer ${token}` }, credentials:'include' });
  if(!res.ok) throw new Error('Could not load profile');
  return res.json();
}

async function apiGet(path){
  const res = await fetch(`${API_BASE}${path}`, { headers:{ Authorization:`Bearer ${S.token}` }, credentials:'include' });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data?.error?.message || `Request failed (${res.status})`);
  return data;
}
async function apiPost(path, body){
  const res = await fetch(`${API_BASE}${path}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${S.token}`, 'Idempotency-Key': crypto.randomUUID() },
    credentials:'include',
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data?.error?.message || `Request failed (${res.status})`);
  return data;
}

// ---------------------------------------------------------------- backend
// Two backends live in this file at once, on purpose. The default is the
// Express/Prisma API that production already runs against, so nothing that
// works today stops working. ?backend=supabase selects the Supabase loop
// instead: its own auth, its own bookings table, realtime rather than
// Socket.IO. Neither knows about the other.
// This build is the standalone Supabase site: Supabase is the only backend
// it has, so there is no Express API to fall back to and no query parameter
// to remember. The API code below stays because the screens share it, but
// nothing here reaches for it -- main carries the build that does.
const BACKEND = 'supabase';
const IS_SB = true;

const SB_URL = 'https://mhiyjrmmrrxqantcxktp.supabase.co';
const SB_KEY = 'sb_publishable_q2boPUlyX8jSEUAkjSLt8A_f9FF-XbE';

// Created lazily: a page on the API backend should not open a session with a
// database it never talks to.
let sb = null;
function sbClient(){
  if(!IS_SB) return null;
  if(sb) return sb;
  if(typeof supabase === 'undefined'){ console.warn('[sb] library not loaded'); return null; }
  sb = supabase.createClient(SB_URL, SB_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });
  return sb;
}

// bookings.status -> the phase names the tracking screen already speaks.
const SB_STATUS_TO_PHASE = {
  pending:'DISPATCHING_TOP3', accepted:'ASSIGNED', started:'IN_PROGRESS',
  completed:'COMPLETED', cancelled:'CANCELLED'
};

// Reads the signed-in user's profile row. RLS means this can only ever
// return the caller's own row, so there is nothing to filter client-side.
async function sbLoadProfile(userId){
  const c = sbClient(); if(!c) return null;
  const { data, error } = await c.from('profiles').select('id, role, name, phone, locality').eq('id', userId).maybeSingle();
  if(error){ console.warn('[sb] profile', error.message); return null; }
  return data;
}

async function sbAdoptSession(session){
  const c = sbClient(); if(!c || !session) return false;
  const profile = await sbLoadProfile(session.user.id);
  if(!profile) return false;
  S.token = session.access_token;
  S.sbUserId = session.user.id;
  S.user = { id:profile.id, name:profile.name || session.user.email, email:session.user.email,
             phone:profile.phone, address:profile.locality };
  S.role = profile.role;
  return true;
}

// ---- auth ----
async function sbSignIn(email, password){
  const c = sbClient(); if(!c) throw new Error('Supabase client unavailable');
  const { data, error } = await c.auth.signInWithPassword({ email, password });
  if(error) throw new Error(error.message);
  if(!(await sbAdoptSession(data.session))) throw new Error('Signed in, but no profile row was found');
}

// Registration goes through an edge function rather than the client's own
// signUp. This project has "Confirm email" switched on and the built-in SMTP
// allows two messages an hour, so a direct signUp dies at the mail step with
// over_email_send_rate_limit and never creates an account at all. The
// function creates the user with the service-role key and marks the address
// confirmed, so no mail is involved. Everything after that -- the sign-in,
// the session, the profile row, RLS -- is the ordinary path.
async function sbSignUp(role, { email, password, name, phone, locality }){
  const c = sbClient(); if(!c) throw new Error('Supabase client unavailable');

  const res = await fetch(`${SB_URL}/functions/v1/signup`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: SB_KEY, Authorization:`Bearer ${SB_KEY}` },
    body: JSON.stringify({ email, password, role, name, phone, locality })
  });
  const out = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(out.error || `Sign-up failed (${res.status})`);

  // Sign in with what was just created, so the session is an ordinary one.
  const { data, error } = await c.auth.signInWithPassword({ email, password });
  if(error) throw new Error(error.message);

  // The trigger runs inside the createUser transaction; give it a moment on a
  // cold project before reading the row back.
  for(let i=0;i<3;i++){
    if(await sbAdoptSession(data.session)) return;
    await new Promise(r=>setTimeout(r,400));
  }
  throw new Error('Account created, but its profile row did not appear');
}

async function sbSignOut(){ const c=sbClient(); if(c) await c.auth.signOut().catch(()=>{}); }

// ---- bookings ----
async function sbCreateBooking(service, price, slot){
  const c = sbClient(); if(!c) throw new Error('Supabase client unavailable');
  const { data, error } = await c.from('bookings')
    .insert({ customer_id:S.sbUserId, service, price, slot, status:'pending' })
    .select('id, code, service, status, price, slot, created_at')
    .single();
  if(error) throw new Error(error.message);
  await c.from('booking_events').insert({ booking_id:data.id, status:'pending', actor_id:S.sbUserId });
  return data;
}

// One place that moves a booking and records who moved it, so the history is
// never written by only some of the paths.
async function sbAdvance(bookingId, status, extra){
  const c = sbClient(); if(!c) throw new Error('Supabase client unavailable');
  const { error } = await c.from('bookings').update({ status, ...(extra||{}) }).eq('id', bookingId);
  if(error) throw new Error(error.message);
  await c.from('booking_events').insert({ booking_id:bookingId, status, actor_id:S.sbUserId });
}

async function sbWorkerBookings(){
  const c = sbClient(); if(!c) return [];
  // RLS returns assigned-to-me plus the pending pool; no filter needed here.
  const { data, error } = await c.from('bookings')
    .select('id, code, service, status, price, slot, customer_id, worker_id, created_at')
    .in('status', ['pending','accepted','started'])
    .order('created_at', { ascending:false });
  if(error){ console.warn('[sb] worker bookings', error.message); return []; }
  return data || [];
}

async function sbRefreshWorker(){
  if(!IS_SB || S.role!=='worker') return;
  S.sbJobs = await sbWorkerBookings();
  render(true);
}

async function sbRefreshCustomerBooking(){
  const c = sbClient(); if(!c || !S.activeBooking) return;
  const { data } = await c.from('bookings')
    .select('id, code, service, status, price, slot, worker_id')
    .eq('id', S.activeBooking.id).maybeSingle();
  if(!data) return;
  S.activeBooking.sbStatus = data.status;
  S.activeBooking.phase = SB_STATUS_TO_PHASE[data.status] || 'REQUESTED';
  if(data.worker_id && !(S.activeBooking.detail && S.activeBooking.detail.worker)){
    const { data: w } = await c.from('profiles').select('name, locality').eq('id', data.worker_id).maybeSingle();
    if(w) S.activeBooking.detail = { worker: { name:w.name, cooperative:w.locality } };
  }
  render(true);
}

// ---- realtime ----
// Postgres change events on the bookings table. Both screens re-read through
// RLS when something moves rather than trusting the payload, so a client is
// never shown a row the policies would not have returned anyway.
function sbSubscribe(){
  const c = sbClient(); if(!c || S.sbChannel) return;
  S.sbChannel = c.channel('worksetu-bookings')
    .on('postgres_changes', { event:'*', schema:'public', table:'bookings' }, () => {
      if(S.role==='worker') sbRefreshWorker();
      if(S.activeBooking) sbRefreshCustomerBooking();
    })
    .subscribe(status => {
      S.socketLive = (status === 'SUBSCRIBED');
      render(true);
    });
}
function sbUnsubscribe(){
  const c = sbClient();
  if(c && S.sbChannel){ c.removeChannel(S.sbChannel); }
  S.sbChannel = null; S.socketLive = false;
}

// Anything that came out of the database is escaped before it goes near
// innerHTML: these screens are built by string interpolation, and a member's
// own name is attacker-controllable text as far as this file is concerned.
function esc(v){
  if(v==null) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function apiPatch(path, body){
  const res = await fetch(`${API_BASE}${path}`, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${S.token}`, 'Idempotency-Key': crypto.randomUUID() },
    credentials:'include',
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data?.error?.message || `Request failed (${res.status})`);
  return data;
}

// Registration goes to the same API as sign-in; there is no public admin
// registration endpoint, by design, so that tab asks the registrar instead.
async function apiRegister(role, body){
  const res = await fetch(`${API_BASE}/auth/${role}/register`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    credentials:'include',
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    const detail = Array.isArray(data?.error?.details) && data.error.details.length
      ? `: ${data.error.details.map(d=>d.message||d.path).join(', ')}` : '';
    throw new Error((data?.error?.message || `Sign-up failed (${res.status})`) + detail);
  }
  return data;
}

// Start and complete change the booking in the database but the API does not
// currently push those two transitions over the socket, so an active booking
// is re-read on a short interval. Dispatch offers are a genuine push; this is
// not, and the screen says "updating" rather than "live" while it applies.
function startBookingPoll(){
  if(S.bookingPoll) return;
  S.bookingPoll = setInterval(async () => {
    const b = S.activeBooking;
    if(!b || !S.token || b.phase==='EXHAUSTED'){ return; }
    try{
      const detail = await apiGet(`/bookings/${b.id}`);
      const status = detail.status || detail.phase;
      const changed = status && status !== b.phase;
      b.detail = detail;
      if(changed) b.phase = status;
      if(changed) render(true);
      if(status==='COMPLETED' || status==='SETTLED' || status==='CANCELLED') stopBookingPoll();
    }catch(e){}
  }, 4000);
}
function stopBookingPoll(){ if(S.bookingPoll){ clearInterval(S.bookingPoll); S.bookingPoll=null; } }

// The phone-shaped demo catalogue and the server's service categories share
// ids for everything except the local-only air-conditioning tile.
const SERVICE_ID_MAP = { ac:'electrical' };
const serverServiceId = id => SERVICE_ID_MAP[id] || id;

// Adyar, Chennai — the seeded customer's own address, so the spatial search
// has cooperative members within range of it.
const DEMO_LOCATION = { address:'14, 2nd Main Rd, Gandhi Nagar, Adyar, Chennai 600020', lat:13.0012, lng:80.2565 };

// ---- live dispatch socket ----
// Rooms are assigned by the server at handshake; there is no join event to
// send. The access token goes in the handshake auth payload, exactly as the
// HTTP requests carry it in the Authorization header.
function connectSocket(){
  if(S.socket || typeof io === 'undefined' || !S.token) return;
  const url = window.WORKSETU_API_BASE || undefined; // same origin via the preview proxy
  // Polling first, then upgrade. The hosting proxy in front of this app
  // forwards HTTP but not WebSocket upgrades, so demanding a socket outright
  // leaves the client retrying a connection it can never make; starting on
  // polling connects either way, and upgrades wherever the upgrade survives.
  const sock = io(url, { auth:{ token:S.token }, transports:['polling','websocket'], withCredentials:true });
  S.socket = sock;

  sock.on('connect', ()=>{ S.socketLive=true; render(true); });
  sock.on('disconnect', ()=>{ S.socketLive=false; render(true); });
  sock.on('connect_error', (e)=>{ S.socketLive=false; console.warn('[socket]', e.message); });

  // Customer: the dispatch engine reports which tier it is on.
  sock.on('dispatch:update', async ({ bookingId, phase }) => {
    if(!S.activeBooking || S.activeBooking.id !== bookingId) return;
    S.activeBooking.phase = phase;
    if(phase === 'ASSIGNED' || phase === 'CONFIRMED' || phase === 'IN_PROGRESS' || phase === 'COMPLETED'){
      try{ S.activeBooking.detail = await apiGet(`/bookings/${bookingId}`); }catch(e){}
    }
    render(true);
  });

  sock.on('dispatch:exhausted', ({ bookingId }) => {
    if(!S.activeBooking || S.activeBooking.id !== bookingId) return;
    S.activeBooking.phase = 'EXHAUSTED';
    render(true);
    toast(t('dispatch.none'));
  });

  // Worker: a real offer, with the server's own countdown.
  sock.on('dispatch:offer', async ({ dispatchLogId, bookingId, phase, offerExpiresInSeconds }) => {
    // A worker cannot read a booking they have not accepted, which is the
    // correct authorization boundary. The details for an open offer come
    // from the worker's own incoming-offers endpoint instead.
    let offer = null;
    try{
      const incoming = await apiGet('/workers/me/incoming');
      offer = incoming.find(o => o.dispatchLogId === dispatchLogId) || incoming[0] || null;
    }catch(e){}

    const total = offer ? Number(offer.estimatedTotal) : null;
    const secondsLeft = offer?.offerExpiresAt
      ? Math.max(1, Math.round((new Date(offer.offerExpiresAt) - Date.now())/1000))
      : (offerExpiresInSeconds || 45);

    S.request = {
      live: true, dispatchLogId, bookingId, phase,
      title: offer ? t('svc.'+offer.serviceCategory) : t('dispatch.newJob'),
      customer: offer?.customerAreaLabel ? offer.customerAreaLabel.split(',').slice(-2)[0].trim() : '—',
      area: offer?.distanceKm != null ? `${Number(offer.distanceKm).toFixed(1)} km` : '',
      // The worker keeps everything but the cooperative's commission.
      pay: total != null ? Math.round(total * (100 - COMMISSION_PCT) / 100) : null
    };
    S.reqStart = Date.now();
    S.reqWindow = secondsLeft;
    render(true);
    toast(t('toast.newReq'));
  });

  sock.on('notification:new', ()=>{ /* in-app notifications already render from state */ });
}

function disconnectSocket(){ if(S.socket){ try{ S.socket.close(); }catch(e){} S.socket=null; S.socketLive=false; } }

// ---- worker location ----
// Candidate scoring only trusts a position while the ping behind it is
// recent, so an online worker reports where they are. Real coordinates when
// the browser will give them, otherwise the member's registered area.
const WORKER_FALLBACK_POS = { lat:13.0067, lng:80.2206 }; // Adyar / Guindy, Chennai

async function pingLocation(){
  if(S.role!=='worker' || !S.online || !S.token) return;
  // The endpoint is rate limited; going off duty and straight back on must
  // not fire a second ping into that window.
  if(S.lastPing && Date.now() - S.lastPing < 30000) return;
  const send = async (lat,lng) => {
    try{ await apiPost('/workers/location-ping', { lat, lng }); S.lastPing = Date.now(); }
    catch(e){ console.warn('[ping]', e.message); }
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p => send(p.coords.latitude, p.coords.longitude),
      () => send(WORKER_FALLBACK_POS.lat, WORKER_FALLBACK_POS.lng),
      { timeout: 4000, maximumAge: 60000 }
    );
  } else {
    await send(WORKER_FALLBACK_POS.lat, WORKER_FALLBACK_POS.lng);
  }
}

// An offer may already be open when the app starts or reconnects — the
// socket only carries new ones, so ask for the current state once.
async function loadIncomingOffer(){
  if(S.role!=='worker' || !S.token || S.request) return;
  try{
    const incoming = await apiGet('/workers/me/incoming');
    const offer = incoming[0];
    if(!offer) return;
    const total = Number(offer.estimatedTotal);
    S.request = {
      live:true, dispatchLogId:offer.dispatchLogId, bookingId:offer.bookingId, phase:'TOP3',
      title: t('svc.'+offer.serviceCategory),
      customer: offer.customerAreaLabel ? offer.customerAreaLabel.split(',').slice(-2)[0].trim() : '—',
      area: offer.distanceKm!=null ? `${Number(offer.distanceKm).toFixed(1)} km` : '',
      pay: Number.isFinite(total) ? Math.round(total * (100 - COMMISSION_PCT) / 100) : null
    };
    S.reqStart = Date.now();
    S.reqWindow = offer.offerExpiresAt ? Math.max(1, Math.round((new Date(offer.offerExpiresAt) - Date.now())/1000)) : 45;
    render(true);
  }catch(e){}
}

// The worker's actual assignments. Rendered ahead of the sample rows on the
// dashboard so a real job is the one you act on.
async function refreshWorkerJobs(){
  if(S.role!=='worker' || !S.token) return;
  try{
    const res = await apiGet('/workers/me/bookings');
    const items = Array.isArray(res) ? res : (res.items || []);
    S.workerJobs = items.filter(b => ['ASSIGNED','CONFIRMED','IN_PROGRESS'].includes(b.status));
    render(true);
  }catch(e){}
}

function startLocationPing(){
  if(S.pingTimer) return;
  pingLocation();
  S.pingTimer = setInterval(pingLocation, 60000);
}
function stopLocationPing(){ if(S.pingTimer){ clearInterval(S.pingTimer); S.pingTimer=null; } }

// On reload the in-memory access token is gone, but the httpOnly refresh
// cookie survives. Trade it for a fresh token so a reload does not look like
// a sign-out. Failure here is normal (no cookie, expired session): stay on
// the login screen and say nothing.
async function resumeSession(){
  if(IS_SB){
    // supabase-js keeps the session in storage and refreshes it itself.
    const c = sbClient(); if(!c) return;
    try{
      const { data } = await c.auth.getSession();
      if(data.session && await sbAdoptSession(data.session)){
        sbSubscribe();
        if(S.role==='worker') sbRefreshWorker();
        render();
      }
    }catch(e){ /* stay signed out */ }
    return;
  }
  try{
    const res = await fetch(`${API_BASE}/auth/refresh`, { method:'POST', credentials:'include' });
    if(!res.ok) return;
    const { token } = await res.json();
    const me = await apiMe(token);
    S.token = token;
    S.user = { id: me.userId, name: me.fullName, email: me.email, phone: me.phone,
               address: me.customerProfile?.defaultAddress || null };
    S.role = (me.role || S.role).toLowerCase();
    connectSocket();
    if(S.role==='worker'){ startLocationPing(); loadIncomingOffer(); refreshWorkerJobs(); }
    render();
  }catch(e){ /* stay signed out */ }
}

// Translate a key in the active language, filling {placeholders} from vars.
// Falls back to English, then to the key itself (and warns) so gaps are visible in dev.
function t(key, vars){
  const row = STR[key];
  if(!row){ console.warn('[i18n] missing key:', key); return key; }
  const s = row[LANG_IDS.indexOf(S.lang)] || row[0];
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m) : s;
}
const tl = key => t(key).split(',');
const langPicker = (cls='seg lang-seg') => `<div class="${cls}" role="group" aria-label="${t('profile.language')}">${LANGS.map(([id,label])=>`<button class="${S.lang===id?'on':''}" lang="${id}" data-a="lang" data-v="${id}" aria-pressed="${S.lang===id}">${label}</button>`).join('')}</div>`;

// ---- persistence (per-tab, optional; language is also remembered across tabs) ----
function save(){ try{ sessionStorage.setItem('ws-local', JSON.stringify({user:!!S.user, role:S.role, theme:S.theme, lang:S.lang})); }catch(e){} try{ localStorage.setItem('ws-lang', S.lang); }catch(e){} }
function load(){
  // The access token is deliberately not persisted. On reload we ask the API
  // to mint a new one from the refresh cookie (resumeSession below); until
  // that answers, the app is signed out.
  try{ const d=JSON.parse(sessionStorage.getItem('ws-local')||'null'); if(d){ S.role=d.role||'customer'; S.theme=d.theme||'light'; S.lang=d.lang||'en'; } }catch(e){}
  try{ S.lang=localStorage.getItem('ws-lang')||S.lang; }catch(e){}
  S.lang=normLang(S.lang);
}

// Renders one of the worker's real assignments. Which button appears is
// decided by the booking's status, because the server rejects a transition
// that is not legal from where the booking currently is.
// A booking as the Supabase loop stores it. Which button shows is decided by
// status, and the RLS policies decide whether pressing it does anything.
function sbJobCard(b){
  const mine = b.worker_id === S.sbUserId;
  const net = Math.round(Number(b.price) * (100-COMMISSION_PCT)/100);
  const action =
    b.status==='pending'  ? `<button class="btn btn-primary btn-sm" data-a="sb-accept" data-v="${esc(b.id)}">${t('jobs.accept')}</button>`
  : b.status==='accepted' && mine ? `<button class="btn btn-primary btn-sm" data-a="job-start" data-v="${esc(b.id)}">${t('jobs.start')}</button>`
  : b.status==='started'  && mine ? `<button class="btn btn-primary btn-sm" data-a="job-done" data-v="${esc(b.id)}">${t('jobs.done')}</button>`
  : `<span class="t-sub" style="margin:0">${esc(b.status)}</span>`;
  return `<div class="card" style="padding:14px;border:1.5px solid var(--primary)">
    <div class="row"><div class="grow">
      <div class="t-title">${esc(t('svc.'+b.service))}</div>
      <div class="t-sub">${esc(b.code)}${b.slot?' • '+esc(b.slot):''}</div>
    </div><span class="badge ${b.status==='pending'?'b-amber':'b-blue'}">${esc(b.status)}</span></div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <b>${inr(net)}</b>${action}</div>
  </div>`;
}

function liveJobCard(b){
  const status = b.status;
  const pay = b.estimatedTotal!=null ? Math.round(Number(b.estimatedTotal) * (100-COMMISSION_PCT)/100) : null;
  const action = status==='CONFIRMED'

// ---------- LIVE DISPATCH (customer) ----------
// Every line on this screen comes from the server: the phase is whatever the
// dispatch engine last emitted, and the worker block appears only once a
// cooperative member has actually accepted.
const DISPATCH_PHASES = [
  { key:'REQUESTED',        label:'dispatch.p.requested' },
  { key:'DISPATCHING_TOP3', label:'dispatch.p.top3' },
  { key:'DISPATCHING_POOL', label:'dispatch.p.pool' },
  { key:'ASSIGNED',         label:'dispatch.p.assigned' },
  { key:'IN_PROGRESS',      label:'dispatch.p.started' },
  { key:'COMPLETED',        label:'dispatch.p.completed' }
];
// CONFIRMED is a server-side durability step between accepting and starting;
// the customer has nothing to do about it, so it shares the assigned row.
const PHASE_ALIAS = { TOP3:'DISPATCHING_TOP3', POOL:'DISPATCHING_POOL', CONFIRMED:'ASSIGNED', SETTLED:'COMPLETED' };

SCREENS.dispatch = ({id}) => {
  const b = S.activeBooking && S.activeBooking.id===id ? S.activeBooking : null;
  if(!b) return { top:titleBar(t('dispatch.title'),'',true), body:`<div class="page"><div class="empty"><div class="t-title">${t('dispatch.gone')}</div></div></div>` };

  const phase = b.phase || 'REQUESTED';
  const assigned = ['ASSIGNED','CONFIRMED','IN_PROGRESS','COMPLETED','SETTLED'].includes(phase);
  const done = assigned;
  const exhausted = phase==='EXHAUSTED';
  const shown = PHASE_ALIAS[phase] || phase;
  const idx = Math.max(0, DISPATCH_PHASES.findIndex(p=>p.key===shown));
  const w = b.detail && b.detail.worker;
  const elapsed = Math.floor((Date.now()-b.startedAt)/1000);

  return { top:titleBar(t('dispatch.title'), b.id.slice(0,8), true), body:`<div class="page">
    <div class="card" style="padding:18px 16px;text-align:center">
      ${exhausted
        ? `<div class="t-title" style="font-size:16px">${t('dispatch.none')}</div><p class="t-sub" style="margin-top:8px">${t('dispatch.noneBody')}</p>`
        : done
          ? `<div class="check-circle" style="width:56px;height:56px;margin:0 auto"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
             <div class="t-title" style="font-size:16px;margin-top:12px">${t('dispatch.assigned')}</div>`
          : `<div class="ring" style="margin:0 auto"><svg width="48" height="48"><circle cx="24" cy="24" r="20" fill="none" stroke="var(--primary-soft)" stroke-width="4"/><circle class="fg" cx="24" cy="24" r="20" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/></svg></div>
             <div class="t-title" style="font-size:16px;margin-top:12px">${t('dispatch.searching')}</div>
             <p class="t-sub" style="margin-top:6px">${t('dispatch.elapsed',{n:elapsed})}</p>`}
      <div class="row" style="justify-content:center;gap:6px;margin-top:10px">
        <span class="badge ${S.socketLive?'b-green':'b-amber'}">${S.socketLive?t('dispatch.live'):t('dispatch.connecting')}</span>
        ${assigned?`<span class="badge b-blue">${t('track.updating')}</span>`:''}
      </div>
    </div>

    <div class="sec-head"><h3>${t('dispatch.progress')}</h3></div>
    <div class="card" style="padding:14px 16px">
      ${DISPATCH_PHASES.map((p,i)=>`<div class="row" style="gap:10px;padding:7px 0">
        <div style="width:9px;height:9px;border-radius:50%;background:${exhausted?'var(--faint)':(i<=idx?'var(--primary)':'var(--border)')}"></div>
        <div class="grow t-title" style="font-size:13px;font-weight:${i===idx&&!done?'800':'600'}">${t(p.label)}</div>
        ${i<idx||done?`<span class="badge b-green">${t('dispatch.doneTag')}</span>`:(i===idx&&!exhausted?`<span class="badge b-blue">${t('dispatch.now')}</span>`:'')}
      </div>`).join('')}
    </div>

    ${w?`<div class="sec-head"><h3>${t('dispatch.worker')}</h3></div>
    <div class="card list-item">
      ${avatar(esc((w.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2)), '#16a34a', 44)}
      <div class="grow"><div class="t-title">${esc(w.name)||'—'}</div>
      <div class="t-sub">${[esc(w.cooperative), w.rating?`${Number(w.rating).toFixed(2)}★ (${w.ratingCount||0})`:null, w.distanceKm!=null?`${Number(w.distanceKm).toFixed(1)} km`:null].filter(Boolean).join(' • ')}</div></div>
    </div>`:''}

    <p class="t-sub" style="text-align:center;margin-top:14px;font-size:11.5px">${t('dispatch.note')}</p>
  </div>` };
};

    <div class="s-item s-lang"><div class="s-ico">${I('globe',18)}</div><div class="grow t-title">${t('profile.language')}</div>${langPicker()}</div>

    <button class="s-item" data-a="toast" data-v="${t('profile.kycToast')}"><div class="s-ico">${I('shield',18)}</div><div class="grow t-title">${t('profile.kyc')}</div><span class="badge b-green">${t('verified')}</span></button>
    <button class="s-item" data-a="toast" data-v="${t('profile.helpToast')}"><div class="s-ico">${I('help',18)}</div><div class="grow t-title">${t('profile.help')}</div>${I('chevR',16)}</button>
  </div>

  </div>` }; };
SCREENS['customer:profile'] = SCREENS['worker:profile'] = SCREENS['admin:profile'] = profileScreen;

/* ===================== RENDER ===================== */
const app = document.getElementById('app');
function render(keepScroll){
  const prev = app.querySelector('.content'); const st = keepScroll && prev ? prev.scrollTop : 0;
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.lang = S.lang;
  [['scroll-up','a11y.scrollUp'],['scroll-down','a11y.scrollDown']].forEach(([id,k])=>{ const b=document.getElementById(id); b.setAttribute('aria-label',t(k)); b.title=t(k); });
  if(!S.splashDone){ app.innerHTML = `<div class="splash">${LOGO(76)}<p style="margin-top:22px">${t('app.tagline')}</p><div class="loader"><i></i></div><div class="foot">${t('app.footer')}</div></div>`; return; }
  let scr;
  if(!S.user) scr = (S.authView==='signup' ? SCREENS.signup() : SCREENS.login());
  else { const top = S.stack[S.stack.length-1]; scr = top ? SCREENS[top.name](top.params||{}) : SCREENS[S.role+':'+S.tab](); }
  const anim = keepScroll ? '' : 'anim-'+S.anim;
  if(scr.raw) app.innerHTML = scr.html + toastHtml();
  else app.innerHTML = statusbar() + (scr.top||'') + `<main class="content ${anim}">${scr.body}</main>` + (scr.cta?`<div class="cta-bar">${scr.cta}</div>`:'') + (scr.nav?bottomNav():'') + toastHtml();
  const c = app.querySelector('.content'); if(c) c.scrollTop = st;
  S.anim = 'fade';
  if(S.user && S.role==='worker' && S.tab==='home' && !S.stack.length) scheduleRequest();
  save();
}
const toastHtml = () => `<div class="toast" id="toast"><div class="ti">${I('check',16,3)}</div><span id="toast-msg"></span></div>`;
let toastT;
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; document.getElementById('toast-msg').textContent=msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

function push(name, params){ S.stack.push({name, params}); S.anim='fwd'; render(); }
function back(){ S.stack.pop(); S.anim='back'; render(); }

// Offers now arrive over the dispatch socket, so nothing is scheduled here.
// Kept as a no-op because the render loop calls it.
function scheduleRequest(){ /* offers come from dispatch:offer */ }

// The countdown runs to the window the server sent with the offer (45s for a
// top-three offer, 120s for the wider pool) rather than a fixed number. When
// it runs out the server has already moved on to the next candidate.
setInterval(()=>{
  if(!S.request) return;
  const window_ = S.reqWindow || 45;
  const left = window_ - Math.floor((Date.now()-S.reqStart)/1000);
  const el = document.getElementById('req-count'); if(el) el.textContent = Math.max(0,left);
  if(left<=0){ S.request=null; if(S.role==='worker'&&S.tab==='home'&&!S.stack.length){ render(true); toast(t('toast.expired')); } }
}, 1000);
// Live clock in status bar
setInterval(()=>{ const t=new Date(); document.querySelectorAll('.statusbar > span').forEach(s=>s.textContent=(t.getHours()%12||12)+':'+String(t.getMinutes()).padStart(2,'0')); }, 15000);

/* ===================== ACTIONS ===================== */
const A = {
  'login-role': v => { S.loginRole=v; S.anim=''; render(true); },
  'to-signup': async () => {
    S.authView='signup'; S.anim='fwd'; render();
    if(S.loginRole==='worker' && (!S.coops || !S.skills)){
      try{
        const [coops, services] = await Promise.all([
          fetch(`${API_BASE}/public/cooperatives`).then(r=>r.json()),
          fetch(`${API_BASE}/services`).then(r=>r.json())
        ]);
        S.coops = Array.isArray(coops) ? coops : (coops.items || []);
        S.skills = Array.isArray(services) ? services : (services.items || []);
        render(true);
      }catch(e){ console.warn('[signup refs]', e.message); }
    }
  },
  'to-login': () => { S.authView='login'; S.anim='back'; render(); },
  'fill-master': () => { const u=document.getElementById('lg-user'), p=document.getElementById('lg-pass');
    const acct = DEMO_ACCOUNTS[S.loginRole];
    typeInto(u, acct.identifier, 22, ()=>typeInto(p, acct.password, 40)); },
  'toggle-pass': () => { const p=document.getElementById('lg-pass'); p.type = p.type==='password'?'text':'password'; },
  tab: v => { if(S.tab===v && !S.stack.length){ const c=app.querySelector('.content'); if(c) c.scrollTo({top:0,behavior:'smooth'}); return; } S.tab=v; S.stack=[]; S.anim='fade'; render(); },
  push: v => push(v),
  back: () => back(),
  theme: () => { S.theme = S.theme==='dark'?'light':'dark'; render(true); },
  lang: v => { const next=normLang(v); if(next===S.lang) return; S.lang=next; render(true); toast(t('toast.lang',{lang:LANGS.find(l=>l[0]===next)[1]})); },
  service: v => { S.draft={date:0, slot:1}; push('service',{id:v}); },
  date: v => { S.draft.date=+v; if(S.draft.date===0&&S.draft.slot===0) S.draft.slot=1; render(true); },
  slot: v => { S.draft.slot=+v; render(true); },
  // Creates a real booking. The server geocodes the address to a PostGIS
  // point, scores eligible cooperative members and starts the top-three
  // offer sequence; from here the screen is driven by dispatch events, not
  // by a timer in this file.
  confirm: async v => {
    if(S.bookingBusy) return;
    S.bookingBusy = true; render(true);
    try{
      const s = svc(v);
      if(IS_SB){
        const row = await sbCreateBooking(v, s.price, SLOTS[S.draft.slot]);
        S.activeBooking = { id:row.id, code:row.code, service:v, phase:'DISPATCHING_TOP3',
                            sbStatus:'pending', detail:null, startedAt:Date.now() };
        S.stack=[{name:'dispatch', params:{id:row.id}}]; S.anim='fade';
        render();
        return;
      }
      const res = await apiPost('/bookings/request', {
        serviceCategoryId: serverServiceId(v),
        location: DEMO_LOCATION,
        description: `${s.name} requested from the Worksetu mobile app.`,
        scheduledAt: null,
        urgency: S.draft.date===0 ? 'URGENT' : 'NORMAL'
      });
      const id = res.bookingId || res.id;
      S.activeBooking = { id, service:v, phase:'REQUESTED', detail:null, startedAt:Date.now() };
      S.stack=[{name:'dispatch', params:{id}}]; S.anim='fade';
      startBookingPoll();
      render();
    }catch(ex){
      toast(ex.message || 'Could not create the booking');
    }finally{
      S.bookingBusy = false; render(true);
    }
  },
  'track-replace': v => { S.tab='bookings'; S.stack=[{name:'track',params:{id:v}}]; S.anim='fwd'; render(); },
  track: v => push('track',{id:v}),
  'track-live': v => { S.stack=[{name:'dispatch', params:{id:v}}]; S.anim='fwd'; render(); },
  advance: v => { const b=S.bookings.find(x=>x.id===v); if(b.step<4){ b.step++; render(true); toast(STEPS[b.step].t + (b.step===4?' 🎉':'')); } },
  bfilter: v => { S.bookingFilter=v; render(true); },
  'read-all': () => { S.notifs.forEach(n=>n.unread=false); render(true); toast(t('toast.readAll')); },
  toast: v => toast(v),
  // Availability is a server-side eligibility condition, not a local toggle:
  // only an AVAILABLE member enters the candidate pool.
  online: async () => {
    S.online=!S.online;
    if(!S.online){ S.request=null; clearTimeout(S.reqTimer); S.reqTimer=null; stopLocationPing(); } else { startLocationPing(); }
    render(true);
    toast(t(S.online?'toast.online':'toast.offline'));
    try{
      const res = await fetch(`${API_BASE}/workers/me/availability`, {
        method:'PATCH',
        headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${S.token}`, 'Idempotency-Key': crypto.randomUUID() },
        credentials:'include',
        body: JSON.stringify({ status: S.online ? 'AVAILABLE' : 'OFF_DUTY' })
      });
      if(!res.ok) throw new Error(`availability ${res.status}`);
    }catch(e){ console.warn('[availability]', e.message); }
  },
  // A live offer is answered on the server, which takes the Redis lock so
  // two workers cannot claim the same booking. Anything without a
  // dispatchLogId is the unwired sample offer and stays local.
  'sb-accept': async v => {
    try{ await sbAdvance(v,'accepted',{ worker_id:S.sbUserId }); await sbRefreshWorker(); toast(t('toast.accepted')); }
    catch(ex){ toast(ex.message || t('dispatch.taken')); }
  },
  accept: async () => {
    const r=S.request; if(!r) return;
    if(!r.live || !r.dispatchLogId){ S.request=null; render(true); toast(t('toast.accepted')); return; }
    try{
      await apiPost(`/dispatch/${r.dispatchLogId}/respond`, { response:'ACCEPT' });
      S.request=null; render(true); toast(t('toast.accepted')); refreshWorkerJobs();
    }catch(ex){ S.request=null; render(true); toast(ex.message || t('dispatch.taken')); }
  },
  decline: async () => {
    const r=S.request; if(!r) return;
    if(r.live && r.dispatchLogId){ try{ await apiPost(`/dispatch/${r.dispatchLogId}/respond`, { response:'DECLINE' }); }catch(e){} }
    S.request=null; render(true); toast(t('toast.declined'));
  },
  // A real booking starts on the server, which checks the transition is
  // legal; the sample rows keep their local behaviour.
  'job-start': async v => {
    if(IS_SB){
      try{ await sbAdvance(v,'started'); await sbRefreshWorker(); toast(t('toast.started')); }
      catch(ex){ toast(ex.message); }
      return;
    }
    const live = (S.workerJobs||[]).find(j=>j.id===v);
    if(live){
      try{ await apiPatch(`/bookings/${v}/start`); await refreshWorkerJobs(); toast(t('toast.started')); }
      catch(ex){ toast(ex.message); }
      return;
    }
    const j=S.jobs.find(x=>x.id===v); if(j){ j.status='active'; render(true); toast(t('toast.started')); }
  },
  'job-done': async v => {
    if(IS_SB){
      const job = (S.sbJobs||[]).find(j=>j.id===v);
      try{
        await sbAdvance(v,'completed');
        await sbRefreshWorker();
        const net = job ? Math.round(Number(job.price) * (100-COMMISSION_PCT)/100) : null;
        toast(net==null ? t('toast.started') : t('toast.credited',{amt:inr(net)}));
      }catch(ex){ toast(ex.message); }
      return;
    }
    const live = (S.workerJobs||[]).find(j=>j.id===v);
    if(live){
      try{
        const res = await apiPatch(`/bookings/${v}/complete`);
        await refreshWorkerJobs();
        toast(res?.workerPayout!=null ? t('toast.credited',{amt:inr(Number(res.workerPayout))}) : t('toast.started'));
      }catch(ex){ toast(ex.message); }
      return;
    }
    const j=S.jobs.find(x=>x.id===v); if(!j) return;
    j.status='done'; S.earningsToday+=j.pay; S.jobsToday++; S.week[6]+=j.pay; render(true); toast(t('toast.credited',{amt:inr(j.pay)}));
  },
  approve: v => { const m=S.members[+v]; m.status='verified'; render(true); toast(t('toast.approved',{name:m.name})); },
  dfilter: v => { S.dispatchFilter=v; render(true); },
  role: v => { if(S.role===v) return; S.role=v; S.tab='home'; S.stack=[]; S.request=null; clearTimeout(S.reqTimer); S.reqTimer=null; S.anim='fade'; render(); toast(t('toast.switched',{role:PERSONAS[v].label})); },
  logout: () => { if(IS_SB){ sbUnsubscribe(); sbSignOut(); } disconnectSocket(); stopLocationPing(); stopBookingPoll(); try{ fetch(`${API_BASE}/auth/logout`, {method:'POST', headers:{Authorization:`Bearer ${S.token}`}, credentials:'include'}); }catch(e){}
    S.user=null; S.token=null; S.activeBooking=null; S.stack=[]; S.tab='home'; S.request=null; S.anim='fade'; render(); }
};

function typeInto(el, text, speed, done){ el.value=''; el.focus(); let i=0; const t=setInterval(()=>{ el.value=text.slice(0,++i); if(i>=text.length){ clearInterval(t); done&&done(); } }, speed); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  e.preventDefault(); const fn = A[el.dataset.a]; if(fn) fn(el.dataset.v, el);
});
const SPINNER = '<span style="display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>';

// Signs in against the live API. The password is checked by the server
// (bcrypt), the access token is kept in memory only, and the refresh token
// arrives as an httpOnly cookie we never read from script.
// Registers through the API, then signs straight in with the credentials
// just created so the person lands in the app rather than back at a form.
document.addEventListener('submit', async e => {
  if(e.target.id!=='signup-form') return; e.preventDefault();
  if(S.signupBusy) return;
  const role = S.loginRole==='admin' ? 'customer' : S.loginRole;
  const btn = e.target.querySelector('button[type=submit]');
  const err = document.getElementById('su-err');
  const val = id => (document.getElementById(id)||{}).value;

  err.classList.remove('show');
  S.signupBusy = true; btn.disabled = true; btn.innerHTML = SPINNER;
  const slow = setTimeout(()=>{ btn.innerHTML = SPINNER + ' <span style="margin-left:8px;font-size:12px">' + t('login.waking') + '</span>'; }, 2500);

  try{
    const email = val('su-email').trim();
    const password = val('su-password');
    const address = val('su-address').trim();
    const base = {
      fullName: val('su-fullName').trim(),
      email, phone: val('su-phone').trim(), password,
      acceptedTerms: document.getElementById('su-terms').checked
    };
    // Registration needs coordinates for the address. Without a geocoder the
    // member's own area is used, which is where the dispatch search needs
    // them to be; a real deployment geocodes what they typed.
    const body = role==='worker'
      ? { ...base,
          cooperativeId: val('su-coop'),
          primarySkillId: val('su-skill'),
          experienceYears: Number(val('su-exp')||0),
          homeLocation: { lat: WORKER_FALLBACK_POS.lat, lng: WORKER_FALLBACK_POS.lng, address },
          serviceAreaRadiusKm: 12 }
      : { ...base, address, lat: DEMO_LOCATION.lat, lng: DEMO_LOCATION.lng };

    if(IS_SB){
      await sbSignUp(role, {
        email, password,
        name: base.fullName, phone: base.phone, locality: address
      });
      clearTimeout(slow);
      S.authView='login'; S.tab='home'; S.stack=[]; S.anim='fade';
      sbSubscribe();
      if(S.role==='worker') sbRefreshWorker();
      render();
      toast(t('toast.signedIn',{ name: S.user.name }));
      return;
    }
    await apiRegister(role, body);
    clearTimeout(slow);

    // Sign in with what was just created, so the session is a normal one.
    const { token } = await apiLogin(role, email, password);
    const me = await apiMe(token);
    S.token = token;
    S.user = { id:me.userId, name:me.fullName, email:me.email, phone:me.phone,
               address: me.customerProfile?.defaultAddress || address };
    S.role = (me.role || role).toLowerCase();
    S.authView='login'; S.tab='home'; S.stack=[]; S.anim='fade';
    connectSocket();
    if(S.role==='worker'){ startLocationPing(); loadIncomingOffer(); refreshWorkerJobs(); }
    render();
    toast(t('toast.signedIn',{ name: me.fullName }));
  }catch(ex){
    clearTimeout(slow);
    err.textContent = ex.message || t('signup.err');
    err.classList.add('show');
  }finally{
    S.signupBusy=false; btn.disabled=false; btn.innerHTML=t('signup.submit');
  }
});

document.addEventListener('submit', async e => {
  if(e.target.id!=='login-form') return; e.preventDefault();
  const identifier = document.getElementById('lg-user').value.trim();
  const password = document.getElementById('lg-pass').value;
  const role = S.loginRole;
  const btn = e.target.querySelector('button[type=submit]');
  const err = document.getElementById('lg-err');

  err.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = SPINNER;

  // The API sleeps on the free tier, so the first sign-in of the day can take
  // the better part of a minute. Say so instead of looking frozen.
  const slow = setTimeout(()=>{ btn.innerHTML = SPINNER + ' <span style="margin-left:8px;font-size:12px">' + t('login.waking') + '</span>'; }, 2500);

  try {
    if(IS_SB){
      await sbSignIn(identifier, password);
      clearTimeout(slow);
      S.tab='home'; S.stack=[]; S.anim='fade';
      sbSubscribe();
      if(S.role==='worker') sbRefreshWorker();
      render();
      toast(t('toast.signedIn',{ name: S.user.name }));
      return;
    }
    const { token } = await apiLogin(role, identifier, password);
    const me = await apiMe(token);
    clearTimeout(slow);

    S.token = token;
    S.user = { id: me.userId, name: me.fullName, email: me.email, phone: me.phone,
               address: me.customerProfile?.defaultAddress || null };
    S.role = (me.role || role).toLowerCase();
    S.tab='home'; S.stack=[]; S.anim='fade';
    connectSocket();
    if(S.role==='worker'){ startLocationPing(); loadIncomingOffer(); refreshWorkerJobs(); }
    render();
    toast(t('toast.signedIn',{ name: me.fullName }));
  } catch (ex) {
    clearTimeout(slow);
    const card=document.querySelector('.login-card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    err.textContent = ex.message || t('login.err');
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = t('login.submit');
  }
});
document.addEventListener('input', e => {
  const map = {'svc-search':'.svc-item', 'mem-search':'.mem-item'}; const sel = map[e.target.id]; if(!sel) return;
  const q = e.target.value.toLowerCase(); document.querySelectorAll(sel).forEach(x => x.style.display = x.dataset.name.includes(q)?'':'none');
});
const spin=document.createElement('style'); spin.textContent='@keyframes spin{to{transform:rotate(360deg)}}'; document.head.appendChild(spin);

/* ===================== BOOT ===================== */
// On desktop, shrink the phone frame so the whole device fits in the window
function fitPhone(){
  const s = innerWidth > 500 ? Math.min(1, (innerHeight - 40) / 844, (innerWidth - 180) / 390) : 1;
  document.documentElement.style.setProperty('--phone-scale', s);
  document.getElementById('scroll-ctl').style.left = (innerWidth / 2 + 195 * s + 28) + 'px';
  updateScrollCtl();
}

/* ---- Scrolling: buttons, mouse wheel anywhere, drag-to-scroll, keyboard ---- */
const scroller = () => app.querySelector('.content');
function scrollApp(dy, smooth=true){ const c=scroller(); if(c) c.scrollBy({top:dy, behavior:smooth?'smooth':'auto'}); }
function updateScrollCtl(){
  const c=scroller(), up=document.getElementById('scroll-up'), down=document.getElementById('scroll-down');
  const max = c ? c.scrollHeight - c.clientHeight : 0;
  up.disabled = !c || c.scrollTop <= 1;
  down.disabled = !c || c.scrollTop >= max - 1;
}
document.getElementById('scroll-up').addEventListener('click', e => { e.stopPropagation(); const c=scroller(); if(c) scrollApp(-c.clientHeight*0.7); });
document.getElementById('scroll-down').addEventListener('click', e => { e.stopPropagation(); const c=scroller(); if(c) scrollApp(c.clientHeight*0.7); });
document.addEventListener('scroll', updateScrollCtl, true);
new MutationObserver(() => { requestAnimationFrame(updateScrollCtl); setTimeout(updateScrollCtl, 450); }).observe(app, {childList:true});
addEventListener('load', updateScrollCtl);
if(document.fonts) document.fonts.ready.then(updateScrollCtl);

// Wheel over the empty background scrolls the app too
addEventListener('wheel', e => { if(!app.contains(e.target) && !e.target.closest('.scroll-ctl')) scrollApp(e.deltaY, false); }, {passive:true});

// Click-and-drag with the mouse to scroll, like a finger swipe
let drag=null, suppressClick=false;
app.addEventListener('pointerdown', e => {
  if(e.pointerType!=='mouse' || e.button!==0 || e.target.closest('input,textarea')) return;
  const c=e.target.closest('.content'); if(!c) return;
  drag={c, y:e.clientY, top:c.scrollTop, moved:false};
});
addEventListener('pointermove', e => {
  if(!drag) return; const dy=e.clientY-drag.y;
  if(!drag.moved && Math.abs(dy)<6) return;
  drag.moved=true; drag.c.classList.add('dragging');
  const scale=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--phone-scale'))||1;
  drag.c.scrollTop = drag.top - dy/scale;
});
addEventListener('pointerup', () => { if(drag){ if(drag.moved){ suppressClick=true; setTimeout(()=>suppressClick=false,0); } drag.c.classList.remove('dragging'); drag=null; } });
addEventListener('click', e => { if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; } }, true);

// Keyboard: arrows, Page Up/Down, Home/End, Space
addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input,textarea')) return;
  const c=scroller(); if(!c) return;
  const page=c.clientHeight*0.85;
  const map={ArrowDown:80, ArrowUp:-80, PageDown:page, PageUp:-page, ' ':e.shiftKey?-page:page};
  if(e.key==='Home'){ c.scrollTo({top:0,behavior:'smooth'}); e.preventDefault(); }
  else if(e.key==='End'){ c.scrollTo({top:c.scrollHeight,behavior:'smooth'}); e.preventDefault(); }
  else if(e.key in map){ scrollApp(map[e.key]); e.preventDefault(); }
});
addEventListener('resize', fitPhone);
fitPhone();
if(new URLSearchParams(location.search).get('statusbar')==='0') document.body.classList.add('no-sb');
load();
render();
if(!S.splashDone) setTimeout(()=>{ const sp=app.querySelector('.splash'); if(sp) sp.style.opacity='0'; setTimeout(()=>{ S.splashDone=true; render(); }, 420); }, 1700);
resumeSession();
</script>
