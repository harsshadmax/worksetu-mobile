<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Worksetu Mobile (Local)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS (matched to worksetu-web) ============ */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --primary:#2563eb; --primary-600:#1d4ed8; --primary-soft:#eff6ff; --primary-line:#bfdbfe;
  --success:#16a34a; --success-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7;
  --danger:#dc2626; --danger-soft:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --radius:18px;
}
html[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#1a2540; --border:#243049;
  --text:#e5e9f2; --muted:#94a3b8; --faint:#64748b;
  --primary:#3b82f6; --primary-600:#2563eb; --primary-soft:rgba(59,130,246,.14); --primary-line:rgba(59,130,246,.35);
  --success:#22c55e; --success-soft:rgba(34,197,94,.14); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,"Noto Sans Devanagari","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.ic{display:block;flex-shrink:0}

/* ============ APP SHELL ============ */
#app{position:relative;display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden}
@media (min-width:501px){
  body{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#dbeafe,#e2e8f0 60%)}
  html[data-theme="dark"] body{background:radial-gradient(circle at 30% 20%,#1e293b,#020617 60%)}
  #app{position:fixed;left:50%;top:50%;width:390px;height:844px;border-radius:48px;border:11px solid #0f172a;box-shadow:0 30px 80px rgba(15,23,42,.35);transform:translate(-50%,-50%) scale(var(--phone-scale,1));transform-origin:center}
}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:15px;font-weight:600;background:var(--surface);position:relative;z-index:5}
.statusbar.on-blue{background:transparent;color:#fff;position:absolute;left:0;right:0;top:0}
.sb-icons{display:flex;gap:6px;align-items:center}
.batt{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;position:relative;opacity:.9}
.batt:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:1px}
.batt i{display:block;height:100%;width:80%;background:currentColor;border-radius:1.5px}
body.no-sb .statusbar{display:none}

.topbar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px 12px;display:flex;align-items:center;gap:10px;min-height:60px;position:relative;z-index:4}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;text-transform:uppercase}
.topbar .sub{font-size:11px;color:var(--muted);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;color:var(--muted);position:relative;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface-2)}
.logo-img{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:4px 8px;border:1px solid #e2e8f0;flex-shrink:0}
.logo-img img{height:100%;width:auto;display:block}
.splash .logo-img{border:0;border-radius:18px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#1e40af);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;letter-spacing:-.04em;box-shadow:0 4px 12px rgba(37,99,235,.3);flex-shrink:0}
.brand-name{font-weight:900;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.chip{font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);letter-spacing:.03em;white-space:nowrap}
.brand-sub{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.content::-webkit-scrollbar{display:none}
.page{padding:16px 16px 28px}
.anim-fwd .page{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.anim-back .page{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.anim-fade .page{animation:fadeUp .35s ease}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* ============ BOTTOM NAV ============ */
.bottomnav{flex-shrink:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:4}
@media (min-width:501px){.bottomnav{padding-bottom:22px}}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--faint);padding:4px 0;position:relative}
.nav-item .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s,color .2s}
.nav-item.active{color:var(--primary)}
.nav-item.active .pill{background:var(--primary-soft)}
.nav-badge{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.cta-bar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
@media (min-width:501px){.cta-bar{padding-bottom:24px}}

/* ============ COMMON UI ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.3)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sm{height:38px;font-size:12px;border-radius:11px;letter-spacing:.04em}
.btn-success{background:var(--success);color:#fff}
.btn-danger-soft{background:var(--danger-soft);color:var(--danger)}
.eyebrow{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.08em;text-transform:uppercase}
.h-display{font-size:30px;line-height:1.05;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.muted{color:var(--muted)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
.sec-head h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sec-head button{font-size:12.5px;font-weight:700;color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.b-blue{background:var(--primary-soft);color:var(--primary)}
.b-green{background:var(--success-soft);color:var(--success)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-gray{background:var(--surface-2);color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t-title{font-weight:700;font-size:14.5px}
.t-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{padding:14px;display:flex;align-items:center;gap:12px}
.divider{height:1px;background:var(--border);margin:14px 0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.3,1.3)}
.toggle.on{background:var(--success)}
.toggle.on:after{transform:translateX(20px)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-bottom:7px;text-transform:uppercase}
.input{display:flex;align-items:center;gap:10px;height:52px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);padding:0 14px;color:var(--faint);transition:border-color .2s,box-shadow .2s}
.input:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--text);min-width:0}
.input input::placeholder{color:var(--faint)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.err{color:var(--danger);font-size:12.5px;font-weight:600;margin:-4px 2px 12px;display:none}
.err.show{display:block}

/* Splash */
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#2563eb,#1e3a8a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:50;transition:opacity .45s}
.splash .logo{width:84px;height:84px;border-radius:26px;font-size:30px;background:#fff;color:var(--primary);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.splash h2{margin-top:18px;font-size:28px;font-weight:900;letter-spacing:.04em;animation:fadeUp .6s .15s both}
.splash p{font-size:11px;font-weight:700;letter-spacing:.2em;opacity:.8;margin-top:4px;animation:fadeUp .6s .25s both}
.loader{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:34px;overflow:hidden}
.loader i{display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:load 1.1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.splash .foot{position:absolute;bottom:42px;font-size:11px;opacity:.7;font-weight:600;letter-spacing:.06em}

/* Login */
.login-hero{background:linear-gradient(160deg,#2563eb 0%,#1e40af 100%);color:#fff;padding:60px 20px 64px;position:relative;overflow:hidden}
.login-hero:before,.login-hero:after,.hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.login-hero:before{width:220px;height:220px;right:-70px;top:-50px}
.login-hero:after{width:140px;height:140px;left:-40px;bottom:-60px}
.pill-light{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:999px;text-transform:uppercase}
.pill-light i{width:6px;height:6px;border-radius:50%;background:#86efac;display:block}
.login-card{margin:-40px 16px 0;padding:18px;position:relative;z-index:2}
.master-card{margin-top:14px;border:1.5px dashed var(--primary-line);background:var(--primary-soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.master-card .mk{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center}

/* Home */
.loc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.loc small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.search{display:flex;align-items:center;gap:10px;width:100%;height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--border);padding:0 14px;color:var(--faint);font-size:14px;margin-top:14px;text-align:left}
.hero-card{margin-top:16px;border-radius:22px;padding:20px;background:linear-gradient(140deg,#2563eb,#1e3a8a);color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(37,99,235,.3)}
.hero-card:before{width:180px;height:180px;right:-50px;top:-60px}
.hero-card:after{width:110px;height:110px;right:40px;bottom:-60px}
.hero-card h2{font-size:24px;font-weight:900;line-height:1.05;margin:12px 0 8px;letter-spacing:-.01em}
.hero-card p{font-size:13px;opacity:.85;max-width:240px;line-height:1.45}
.btn-white{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1d4ed8;font-weight:800;font-size:12px;letter-spacing:.05em;padding:11px 16px;border-radius:12px;text-transform:uppercase;position:relative;z-index:1}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc-tile{padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;text-align:center;transition:transform .15s}
.svc-tile:active{transform:scale(.95)}
.svc-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.worker-card{min-width:210px;padding:14px}
.stars{display:inline-flex;align-items:center;gap:3px;color:#f59e0b;font-weight:800;font-size:12px}
.feature{padding:14px;display:flex;gap:12px;align-items:flex-start}
.feature .fi{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 12px}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--primary);letter-spacing:-.02em}
.stat span{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.active-bk{padding:14px;margin-top:16px;border-left:4px solid var(--primary)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .5s}

/* Booking */
.svc-hero{padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex-shrink:0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;text-align:center;transition:all .15s}
.chip-btn small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.chip-btn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.chip-btn.on small{color:var(--primary)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots .chip-btn{padding:11px 4px}
.chip-btn.disabled{opacity:.4;text-decoration:line-through;pointer-events:none}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
.sum-row.total{font-weight:800;font-size:16px;border-top:1px dashed var(--border);margin-top:6px;padding-top:12px}
.success-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.check-circle{width:96px;height:96px;border-radius:50%;background:var(--success);display:grid;place-items:center;color:#fff;animation:pop .5s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 0 12px var(--success-soft)}
.check-circle svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Tracking */
.map{height:190px;border-radius:20px;position:relative;overflow:hidden;background:
  linear-gradient(90deg,transparent 48%,rgba(148,163,184,.35) 48%,rgba(148,163,184,.35) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(0deg,transparent 48%,rgba(148,163,184,.35) 48%,rgba(148,163,184,.35) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(135deg,#e0f2fe,#ecfdf5)}
html[data-theme="dark"] .map{background:
  linear-gradient(90deg,transparent 48%,rgba(100,116,139,.3) 48%,rgba(100,116,139,.3) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(0deg,transparent 48%,rgba(100,116,139,.3) 48%,rgba(100,116,139,.3) 52%,transparent 52%) 0 0/70px 70px,
  linear-gradient(135deg,#0c1a33,#0b2420)}
.map svg.route{position:absolute;inset:0}
.pin-home,.pin-worker{position:absolute;display:grid;place-items:center;border-radius:50%}
.pin-home{width:34px;height:34px;background:var(--primary);color:#fff;right:48px;top:40px;box-shadow:0 0 0 8px rgba(37,99,235,.2)}
.pin-worker{width:30px;height:30px;background:#fff;color:var(--success);border:3px solid var(--success);transition:left 1s ease,top 1s ease;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.pin-worker:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--success);animation:ping 1.6s infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.4);opacity:0}}
.eta{position:absolute;left:12px;bottom:12px;background:var(--surface);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.timeline{position:relative;padding-left:4px}
.tl{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl:last-child{padding-bottom:0}
.tl:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border)}
.tl:last-child:before{display:none}
.tl.done:before{background:var(--success)}
.tl .dotc{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;flex-shrink:0;color:#fff;position:relative;z-index:1}
.tl.done .dotc{background:var(--success);border-color:var(--success)}
.tl.now .dotc{border-color:var(--primary);box-shadow:0 0 0 5px var(--primary-soft)}
.tl.now .dotc:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.tl .t-title{font-size:13.5px}
.tl:not(.done):not(.now) .t-title{color:var(--faint)}
.otp{display:flex;gap:6px}
.otp span{width:34px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:900;font-size:17px}

/* Worker */
.online-card{padding:16px;display:flex;align-items:center;gap:14px;transition:background .3s}
.online-card.on{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border-color:transparent}
.online-card.on .t-sub{color:rgba(255,255,255,.8)}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--faint);position:relative}
.online-card.on .pulse{background:#bbf7d0}
.online-card.on .pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #bbf7d0;animation:ping 1.4s infinite}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kpi{padding:12px}
.kpi span{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi b{display:block;font-size:19px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.request{margin-top:16px;padding:16px;border:2px solid var(--primary);animation:reqIn .5s cubic-bezier(.2,1.3,.4,1);position:relative;overflow:hidden}
.request:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--primary-soft),transparent);animation:shimmer 2s infinite;pointer-events:none}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes reqIn{from{transform:translateY(30px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.ring{position:relative;width:48px;height:48px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring circle.fg{stroke-dasharray:125.6;animation:ringdown 30s linear forwards}
@keyframes ringdown{to{stroke-dashoffset:125.6}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--primary)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--primary-line);animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.bar.today i{background:var(--primary)}
.bar span{font-size:10.5px;font-weight:700;color:var(--muted)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.benefit{padding:14px;display:flex;flex-direction:column;gap:8px}
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Admin */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-lg{padding:16px}
.kpi-lg .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.kpi-lg span{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.kpi-lg b{display:block;font-size:30px;font-weight:900;color:var(--primary);margin-top:8px;letter-spacing:-.03em}
.kpi-lg small{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.trend{color:var(--success);font-size:11px;font-weight:800}
.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:var(--success);letter-spacing:.06em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--success);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* Profile */
.profile-head{padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.profile-head .avatar{width:78px;height:78px;border-radius:24px;font-size:26px;margin-bottom:12px}
.settings .s-item{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-bottom:1px solid var(--border)}
.settings .s-item:last-child{border:0}
.s-ico{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.role-opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);width:100%;text-align:left}
.role-opt.on{border-color:var(--primary);background:var(--primary-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center}
.role-opt.on .radio{border-color:var(--primary)}
.role-opt.on .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px}

/* Toast */
.toast{position:absolute;left:16px;right:16px;top:56px;z-index:60;background:#0f172a;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140%);opacity:0;transition:all .35s cubic-bezier(.2,1.2,.4,1)}
html[data-theme="dark"] .toast{background:#e5e9f2;color:#0f172a}
.toast.show{transform:none;opacity:1}
.toast .ti{width:28px;height:28px;border-radius:9px;background:var(--success);display:grid;place-items:center;color:#fff}
.sandbox-tag{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.08em;pointer-events:none;z-index:6;display:none}

/* ===================== RENDER ===================== */
const app = document.getElementById('app');
function render(keepScroll){
  const prev = app.querySelector('.content'); const st = keepScroll && prev ? prev.scrollTop : 0;
  document.documentElement.dataset.theme = S.theme;
  if(!S.splashDone){ app.innerHTML = `<div class="splash">${LOGO(76)}<p style="margin-top:22px">COOPERATIVE GIG SERVICES</p><div class="loader"><i></i></div><div class="foot">SMART INDIA HACKATHON 2026</div></div>`; return; }
  let scr;
  if(!S.user) scr = SCREENS.login();
  else { const top = S.stack[S.stack.length-1]; scr = top ? SCREENS[top.name](top.params||{}) : SCREENS[S.role+':'+S.tab](); }
  const anim = keepScroll ? '' : 'anim-'+S.anim;
  if(scr.raw) app.innerHTML = scr.html + toastHtml();
  else app.innerHTML = statusbar() + (scr.top||'') + `<main class="content ${anim}">${scr.body}</main>` + (scr.cta?`<div class="cta-bar">${scr.cta}</div>`:'') + (scr.nav?bottomNav():'') + toastHtml();
  const c = app.querySelector('.content'); if(c) c.scrollTop = st;
  S.anim = 'fade';
  if(S.user && S.role==='worker' && S.tab==='home' && !S.stack.length) scheduleRequest();
  save();
}
const toastHtml = () => `<div class="toast" id="toast"><div class="ti">${I('check',16,3)}</div><span id="toast-msg"></span></div>`;
let toastT;
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; document.getElementById('toast-msg').textContent=msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

function push(name, params){ S.stack.push({name, params}); S.anim='fwd'; render(); }
function back(){ S.stack.pop(); S.anim='back'; render(); }

// Worker dispatch request simulation
function scheduleRequest(){
  if(!S.online || S.request || S.reqTimer) return;
  S.reqTimer = setTimeout(()=>{
    S.reqTimer=null; if(!S.online || S.request || S.role!=='worker') return;
    S.request = REQUESTS[S.reqIdx++ % REQUESTS.length]; S.reqStart = Date.now();
    if(S.tab==='home' && !S.stack.length){ render(true); toast('New dispatch request nearby'); }
  }, 3500);
}
setInterval(()=>{
  if(!S.request) return;
  const left = 30 - Math.floor((Date.now()-S.reqStart)/1000);
  const el = document.getElementById('req-count'); if(el) el.textContent = Math.max(0,left);
  if(left<=0){ S.request=null; if(S.role==='worker'&&S.tab==='home'&&!S.stack.length){ render(true); toast('Request expired'); } }
}, 1000);
// Live clock in status bar
setInterval(()=>{ const t=new Date(); document.querySelectorAll('.statusbar > span').forEach(s=>s.textContent=(t.getHours()%12||12)+':'+String(t.getMinutes()).padStart(2,'0')); }, 15000);

/* ===================== ACTIONS ===================== */
const A = {
  'login-role': v => { S.loginRole=v; S.anim=''; render(true); },
  'fill-master': () => { const u=document.getElementById('lg-user'), p=document.getElementById('lg-pass');
    typeInto(u, MASTER.email, 22, ()=>typeInto(p, MASTER.password, 40)); },
  'toggle-pass': () => { const p=document.getElementById('lg-pass'); p.type = p.type==='password'?'text':'password'; },
  tab: v => { if(S.tab===v && !S.stack.length){ const c=app.querySelector('.content'); if(c) c.scrollTo({top:0,behavior:'smooth'}); return; } S.tab=v; S.stack=[]; S.anim='fade'; render(); },
  push: v => push(v),
  back: () => back(),
  theme: () => { S.theme = S.theme==='dark'?'light':'dark'; render(true); },
  lang: () => { S.lang = LANGS[(LANGS.indexOf(S.lang)+1)%LANGS.length]; render(true); toast('Language: '+S.lang); },
  service: v => { S.draft={date:0, slot:1}; push('service',{id:v}); },
  date: v => { S.draft.date=+v; if(S.draft.date===0&&S.draft.slot===0) S.draft.slot=1; render(true); },
  slot: v => { S.draft.slot=+v; render(true); },
  confirm: v => {
    const s=svc(v), id='WS-'+(24818+S.bookings.length);
    S.bookings.unshift({id, service:v, date:DATES[S.draft.date].label==='Today'?'Today':DATES[S.draft.date].label==='Tomorrow'?'Tomorrow':DATES[S.draft.date].sub, slot:SLOTS[S.draft.slot], step:1, price:s.price+29});
    S.notifs.unshift({icon:'check', title:'Booking confirmed', body:`${s.name} • ${WORKERS[v].name} assigned`, time:'now', unread:true, tone:'b-green'});
    S.stack=[{name:'success', params:{id}}]; S.anim='fade'; render();
  },
  'track-replace': v => { S.tab='bookings'; S.stack=[{name:'track',params:{id:v}}]; S.anim='fwd'; render(); },
  track: v => push('track',{id:v}),
  advance: v => { const b=S.bookings.find(x=>x.id===v); if(b.step<4){ b.step++; render(true); toast(STEPS[b.step].t + (b.step===4?' 🎉':'')); } },
  bfilter: v => { S.bookingFilter=v; render(true); },
  'read-all': () => { S.notifs.forEach(n=>n.unread=false); render(true); toast('All caught up'); },
  toast: v => toast(v),
  online: () => { S.online=!S.online; if(!S.online){ S.request=null; clearTimeout(S.reqTimer); S.reqTimer=null; } render(true); toast(S.online?'You are now online':'You are now offline'); },
  accept: () => { const r=S.request; S.request=null; S.jobs.unshift({id:'J-'+(5522+S.reqIdx), title:r.title, customer:r.customer, area:r.area, slot:'Today, in 30 min', pay:r.pay, status:'upcoming'}); render(true); toast('Job accepted • customer notified'); },
  decline: () => { S.request=null; render(true); toast('Request declined'); },
  'job-start': v => { S.jobs.find(j=>j.id===v).status='active'; render(true); toast('Job started • OTP verified'); },
  'job-done': v => { const j=S.jobs.find(x=>x.id===v); j.status='done'; S.earningsToday+=j.pay; S.jobsToday++; S.week[6]+=j.pay; render(true); toast(inr(j.pay)+' credited to cooperative ledger'); },
  approve: v => { const m=S.members[+v]; m.status='verified'; render(true); toast(m.name+' approved as member'); },
  dfilter: v => { S.dispatchFilter=v; render(true); },
  role: v => { if(S.role===v) return; S.role=v; S.tab='home'; S.stack=[]; S.request=null; clearTimeout(S.reqTimer); S.reqTimer=null; S.anim='fade'; render(); toast('Switched to '+PERSONAS[v].label+' portal'); },
  logout: () => { S.user=null; S.stack=[]; S.tab='home'; S.request=null; S.anim='fade'; render(); }
};

function typeInto(el, text, speed, done){ el.value=''; el.focus(); let i=0; const t=setInterval(()=>{ el.value=text.slice(0,++i); if(i>=text.length){ clearInterval(t); done&&done(); } }, speed); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  e.preventDefault(); const fn = A[el.dataset.a]; if(fn) fn(el.dataset.v, el);
});
document.addEventListener('submit', e => {
  if(e.target.id!=='login-form') return; e.preventDefault();
  const u=document.getElementById('lg-user').value.trim().toLowerCase(), p=document.getElementById('lg-pass').value;
  if((u===MASTER.email || u===MASTER.phone) && p===MASTER.password){
    const btn=e.target.querySelector('button[type=submit]'); btn.innerHTML='<span style="display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>';
    setTimeout(()=>{ S.user=MASTER; S.role=S.loginRole; S.tab='home'; S.stack=[]; S.anim='fade'; render(); toast('Signed in as '+PERSONAS[S.role].name); }, 700);
  } else {
    const card=document.querySelector('.login-card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    document.getElementById('lg-err').classList.add('show');
  }
});
document.addEventListener('input', e => {
  const map = {'svc-search':'.svc-item', 'mem-search':'.mem-item'}; const sel = map[e.target.id]; if(!sel) return;
  const q = e.target.value.toLowerCase(); document.querySelectorAll(sel).forEach(x => x.style.display = x.dataset.name.includes(q)?'':'none');
});
const spin=document.createElement('style'); spin.textContent='@keyframes spin{to{transform:rotate(360deg)}}'; document.head.appendChild(spin);

/* ===================== BOOT ===================== */
// On desktop, shrink the phone frame so the whole device fits in the window
function fitPhone(){
  const s = innerWidth > 500 ? Math.min(1, (innerHeight - 40) / 844, (innerWidth - 40) / 390) : 1;
  document.documentElement.style.setProperty('--phone-scale', s);
}
addEventListener('resize', fitPhone);
fitPhone();
if(new URLSearchParams(location.search).get('statusbar')==='0') document.body.classList.add('no-sb');
load();
render();
if(!S.splashDone) setTimeout(()=>{ const sp=app.querySelector('.splash'); if(sp) sp.style.opacity='0'; setTimeout(()=>{ S.splashDone=true; render(); }, 420); }, 1700);
</script>
