# Keeps the Supabase project from pausing.
#
# A free Supabase project pauses after 7 days with no activity -- which is
# exactly what had happened to this one before it was restored. A single
# query resets that clock, so this is about recency, not frequency: once a
# day is enough, and hammering it would not help.
#
# GitHub skips scheduled workflows on repositories with no activity for 60
# days, and cron here is best-effort rather than exact. Treat it as a
# safeguard against the 7-day pause, not a guarantee of uptime.
name: keep the database awake

on:
  schedule:
    # 06:40 UTC daily. An odd minute on purpose: the top of the hour is when
    # GitHub's scheduler is busiest and runs are most likely to be delayed.
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: https://mhiyjrmmrrxqantcxktp.supabase.co
          # The publishable key is safe in the repository: it is the same key
          # the browser ships with, and every table behind it is protected by
          # row-level security. It is not the service-role key.
          SUPABASE_KEY: sb_publishable_q2boPUlyX8jSEUAkjSLt8A_f9FF-XbE
        run: |
          # A HEAD against a table is the cheapest thing that still counts as
          # database activity. RLS returns nothing to an anonymous caller,
          # which is fine -- reaching Postgres is the whole point.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -I "$SUPABASE_URL/rest/v1/bookings?select=id&limit=1")
          echo "supabase /rest/v1/bookings -> $code"
          # 200 and 206 both mean the query reached Postgres. A 401 means the
          # key is wrong, which should fail loudly rather than pass quietly
          # while the project drifts towards being paused.
          case "$code" in
            200|206) echo "supabase reached" ;;
            401|403) echo "::error::supabase rejected the key ($code)"; exit 1 ;;
            *)       echo "::warning::supabase returned $code" ;;
          esac
